appId: ${APP_ID}
---
- runFlow:
    label: Sign in
    file: ../shared/signin.yml
- tapOn:
    id: bottom-nav-profile
- scrollUntilVisible:
    element:
      text: Google Calendar
    direction: DOWN
    timeout: 20000
- assertVisible: Google Calendar
- assertVisible: Sync appointments with your Google Calendar.
- scrollUntilVisible:
    element:
      id: settings-google-connect-button
    direction: DOWN
    timeout: 20000
    optional: true
- scrollUntilVisible:
    element:
      id: settings-google-disconnect-button
    direction: DOWN
    timeout: 20000
    optional: true
- scrollUntilVisible:
    element:
      id: settings-google-reconnect-button
    direction: DOWN
    timeout: 20000
    optional: true
- evalScript: ${output.googleCalendarBranchExercised = false}
- runFlow:
    when:
      visible:
        id: settings-google-connect-button
    commands:
      - evalScript: ${output.googleCalendarBranchExercised = true}
- runFlow:
    when:
      visible:
        id: settings-google-disconnect-button
    commands:
      - evalScript: ${output.googleCalendarBranchExercised = true}
- runFlow:
    when:
      visible:
        id: settings-google-reconnect-button
    commands:
      - evalScript: ${output.googleCalendarBranchExercised = true}
- assertTrue:
    condition: ${output.googleCalendarBranchExercised}
    label: "Google Calendar sync controls were not reachable."
- tapOn:
    id: bottom-nav-sessions
- assertVisible:
    id: dashboard-search-input
