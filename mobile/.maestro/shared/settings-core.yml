appId: ${APP_ID}
---
# Profile edit, change-password entry point and audio retention policy.
# Leaves the seeded values (Demo Clinician, 30-day retention) unchanged.
- runFlow:
    label: Sign in
    file: signin.yml
- tapOn:
    id: bottom-nav-profile
- assertVisible:
    id: settings-save-button
- tapOn:
    id: settings-firstname-input
- eraseText: 12
- inputText: Demo
- tapOn:
    id: settings-lastname-input
- eraseText: 12
- inputText: Clinician
- tapOn:
    id: settings-save-button
- extendedWaitUntil:
    visible: Profile updated.
    timeout: 10000
- tapOn:
    id: settings-change-password-button
- assertVisible:
    id: password-send-code-button
- tapOn:
    id: password-back-button
- scrollUntilVisible:
    element:
      id: settings-retention-forever
    direction: DOWN
    timeout: 20000
- tapOn:
    id: settings-retention-forever
- extendedWaitUntil:
    visible: Retention policy updated.
    timeout: 10000
- tapOn:
    id: settings-retention-30d
- tapOn:
    id: bottom-nav-patients
- assertVisible:
    id: patient-list-search-input
