name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify repository
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: physio_dev
          POSTGRES_PASSWORD: physio_dev_pass
          POSTGRES_DB: physio_note_finisher
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U physio_dev -d physio_note_finisher"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Same throwaway database as docker-compose.yml; never a real deployment.
      DATABASE_URL: postgresql://physio_dev:physio_dev_pass@localhost:5433/physio_note_finisher

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        run: npm run audit:gate

      - name: Generate Prisma client
        run: npm --workspace backend run prisma:generate

      - name: Apply migrations and seed
        working-directory: backend
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - name: Doctors, lint, typecheck and tests
        run: npm run verify:local
