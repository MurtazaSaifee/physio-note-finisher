appId: ${APP_ID}
---
# New patient -> schedule a visit -> open the appointment -> start the session.
- runFlow:
    label: Sign in
    file: signin.yml
- evalScript: ${output.patientName = 'Maestro ' + String(Date.now()).slice(-6)}
- tapOn:
    id: patient-list-add-patient-button
- tapOn:
    id: new-patient-fullname-input
- inputText: ${output.patientName}
- tapOn:
    id: new-patient-phone-input
- inputText: '+91 90000 20001'
- tapOn:
    id: new-patient-save-button
- extendedWaitUntil:
    visible:
      id: patient-profile-new-session-button
    timeout: 20000
- assertVisible: ${output.patientName}
- scrollUntilVisible:
    element:
      id: patient-profile-create-appointment-row
    direction: DOWN
    timeout: 20000
- tapOn:
    id: patient-profile-create-appointment-row
- tapOn:
    id: new-appointment-duration-30-chip
- tapOn:
    id: new-appointment-create-button
- extendedWaitUntil:
    visible:
      id: appointment-detail-start-session-button
    timeout: 20000
- tapOn:
    id: appointment-detail-start-session-button
- assertVisible:
    id: start-session-voice-recap-button
- assertVisible:
    id: start-session-write-manually-button
