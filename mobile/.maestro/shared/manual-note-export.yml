appId: ${APP_ID}
---
# Manual SOAP note (no AI) -> finalize -> PDF export, for an existing patient.
- runFlow:
    label: Sign in
    file: signin.yml
- scrollUntilVisible:
    element:
      text: Open patient record for Priya Nair.*
    direction: DOWN
    timeout: 20000
- tapOn:
    text: Open patient record for Priya Nair.*
- tapOn:
    id: patient-profile-new-session-button
- tapOn:
    id: start-session-write-manually-button
- tapOn:
    id: note-start-manual-button
- tapOn:
    id: note-subjective-row
- tapOn:
    id: note-subjective-input
- inputText: Lower back stiffness eased, sitting tolerance now 45 minutes
- tapOn:
    id: note-back-button
- tapOn:
    id: note-plan-row
- tapOn:
    id: note-plan-input
- inputText: Continue core stability programme, review in one week
- tapOn:
    id: note-back-button
- tapOn:
    id: note-continue-final-review-button
- extendedWaitUntil:
    visible:
      id: note-finalize-action-button
    timeout: 30000
- tapOn:
    id: note-finalize-action-button
- tapOn:
    id: note-confirm-action-button
- extendedWaitUntil:
    visible: Note finalized.
    timeout: 20000
- scrollUntilVisible:
    element:
      id: note-export-share-button
    direction: DOWN
    timeout: 20000
- tapOn:
    id: note-export-share-button
- scrollUntilVisible:
    element:
      id: export-share-export-pdf-button
    direction: DOWN
    timeout: 20000
- tapOn:
    id: export-share-export-pdf-button
- extendedWaitUntil:
    visible: Saved
    timeout: 60000
- tapOn: OK
