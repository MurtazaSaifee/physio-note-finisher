services:
  db:
    image: postgres:16-alpine
    container_name: physio_note_finisher_db
    environment:
      POSTGRES_USER: physio_dev
      POSTGRES_PASSWORD: physio_dev_pass
      POSTGRES_DB: physio_note_finisher
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U physio_dev -d physio_note_finisher"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
