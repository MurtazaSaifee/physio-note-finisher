appId: ${APP_ID}
---
# Voice recap -> transcript -> SOAP draft -> patient summary -> finalize -> export.
# Locally the backend uses the offline demo speech-to-text and SOAP providers,
# so the generated text is deterministic.
- runFlow:
    label: Sign in
    file: signin.yml
- scrollUntilVisible:
    element:
      text: Open patient record for Karthik Reddy.*
    direction: DOWN
    timeout: 20000
- tapOn:
    text: Open patient record for Karthik Reddy.*
- tapOn:
    id: patient-profile-new-session-button
- tapOn:
    id: start-session-voice-recap-button
- tapOn:
    id: voice-capture-start-recording-button
- tapOn:
    text: While using the app
    optional: true
- assertVisible:
    id: voice-capture-stop-button
- runScript: wait-for-voice-duration.js
- tapOn:
    id: voice-capture-stop-button
- tapOn:
    id: voice-capture-upload-button
- tapOn:
    id: voice-capture-consent-confirm-button
    optional: true
- extendedWaitUntil:
    visible:
      id: transcript-review-generate-soap-button
    timeout: 60000
- assertVisible: .*ACL reconstruction.*
- tapOn:
    id: transcript-review-generate-soap-button
- extendedWaitUntil:
    visible:
      id: note-continue-final-review-button
    timeout: 60000
- assertVisible: .*Knee flexion 120.*
- tapOn:
    id: note-continue-final-review-button
- extendedWaitUntil:
    visible:
      id: note-finalize-action-button
    timeout: 30000
- assertVisible: .*Your knee is healing well.*
- tapOn:
    id: note-finalize-action-button
- tapOn:
    id: note-confirm-action-button
- extendedWaitUntil:
    visible: Note finalized.
    timeout: 20000
- scrollUntilVisible:
    element:
      id: note-export-share-button
    direction: DOWN
    timeout: 20000
- tapOn:
    id: note-export-share-button
- extendedWaitUntil:
    visible:
      id: export-share-full-note-mode-chip
    timeout: 20000
- scrollUntilVisible:
    element:
      id: export-share-export-pdf-button
    direction: DOWN
    timeout: 20000
- tapOn:
    id: export-share-export-pdf-button
- extendedWaitUntil:
    visible: Saved
    timeout: 60000
- tapOn: OK
- tapOn:
    id: export-share-patient-summary-mode-chip
- assertVisible:
    id: export-share-share-summary-text-button
