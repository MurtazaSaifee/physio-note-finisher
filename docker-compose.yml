# `npm run setup` starts only `db` (host port 5433 avoids clashing with a
# Postgres you may already run on 5432).
# `docker compose up --build` also starts a seeded API on :3000 with no API keys.
services:
  db:
    image: postgres:16-alpine
    container_name: physio_note_finisher_db
    environment:
      POSTGRES_USER: physio_dev
      POSTGRES_PASSWORD: physio_dev_pass
      POSTGRES_DB: physio_note_finisher
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U physio_dev -d physio_note_finisher"]
      interval: 2s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: physio_note_finisher_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgresql://physio_dev:physio_dev_pass@db:5432/physio_note_finisher
      # Throwaway local secrets, same as backend/.env.example.
      JWT_ACCESS_SECRET: local-dev-access-secret-not-for-production
      JWT_REFRESH_SECRET: local-dev-refresh-secret-not-for-production
      SARVAM_API_KEY: ""
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  pgdata:
