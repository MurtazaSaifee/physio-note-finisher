appId: ${APP_ID}
---
- killApp
- launchApp:
    clearState: true
- runScript: wait-for-auth-bootstrap.js
- assertVisible:
    id: signin-submit-button
- tapOn:
    id: signin-email-input
- inputText: ${LOGIN_EMAIL}
- tapOn:
    id: signin-password-input
- inputText: ${LOGIN_PASSWORD}
- hideKeyboard
- tapOn:
    id: signin-submit-button
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: bottom-nav-patients
    timeout: 20000
- assertVisible:
    id: patient-list-search-input
