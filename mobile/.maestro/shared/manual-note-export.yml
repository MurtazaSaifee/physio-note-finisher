appId: ${APP_ID}
---
- runFlow:
    label: Sign in
    file: ../shared/signin.yml
- tapOn:
    id: dashboard-create-session-button
- evalScript: ${output.patientName = 'Maestro Manual ' + Date.now() + '-' + Math.floor(Math.random() * 1000)}
- tapOn:
    id: select-patient-add-new-patient-button
- assertVisible:
    id: select-patient-fullname-input
- tapOn:
    id: select-patient-fullname-input
- inputText: ${output.patientName}
- tapOn:
    id: select-patient-phone-input
- inputText: 555-0130
- tapOn:
    id: select-patient-condition-tags-input
- inputText: knee, balance
- tapOn:
    id: select-patient-add-new-patient-button
- assertVisible:
    id: start-session-view-library-button
- tapOn:
    id: start-session-view-library-button
- assertVisible:
    id: template-library-template-0-card
- tapOn:
    id: template-library-template-0-card
- scrollUntilVisible:
    element:
      id: template-library-use-template-button
    direction: DOWN
    timeout: 20000
- tapOn:
    id: template-library-use-template-button
- scrollUntilVisible:
    element:
      id: note-save-draft-button
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: note-save-draft-button
- scrollUntilVisible:
    element:
      id: note-mode-replace-all-chip
    direction: DOWN
    timeout: 20000
- tapOn:
    id: note-mode-replace-all-chip
- scrollUntilVisible:
    element:
      id: note-subjective-input
    direction: UP
    timeout: 20000
- tapOn:
    id: note-subjective-input
- longPressOn:
    id: note-subjective-input
- eraseText: 100
- inputText: Manual subjective update
- scrollUntilVisible:
    element:
      id: note-mode-fill-blanks-chip
    direction: DOWN
    timeout: 20000
- tapOn:
    id: note-mode-fill-blanks-chip
- scrollUntilVisible:
    element:
      id: note-save-draft-button
    direction: UP
    timeout: 20000
- tapOn:
    id: note-save-draft-button
- scrollUntilVisible:
    element:
      id: note-finalize-action-button
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: note-finalize-action-button
- tapOn:
    id: note-finalize-action-button
- tapOn:
    id: note-confirm-action-button
- assertVisible:
    id: note-export-share-button
- tapOn:
    id: note-export-share-button
- assertVisible:
    id: export-share-full-note-mode-chip
- scrollUntilVisible:
    element:
      id: export-share-copy-note-button
    direction: DOWN
    timeout: 20000
- tapOn:
    id: export-share-copy-note-button
- scrollUntilVisible:
    element:
      id: export-share-export-pdf-button
    direction: DOWN
    timeout: 20000
- tapOn:
    id: export-share-export-pdf-button
- assertVisible: Saved
- tapOn:
    text: OK
- runFlow:
    when:
      visible:
        id: export-share-full-note-mode-chip
    commands:
      - back
- assertVisible:
    id: note-back-button
- tapOn:
    id: note-back-button
- assertVisible:
    id: bottom-nav-patients
- tapOn:
    id: bottom-nav-patients
- tapOn:
    id: patient-list-search-input
- inputText: ${output.patientName}
- assertVisible: ${output.patientName}
- back
- tapOn:
    id: patient-list-patient-0-card
- assertVisible:
    id: patient-profile-new-session-button
- scrollUntilVisible:
    element:
      id: patient-profile-record-0-card
    direction: DOWN
    timeout: 20000
- tapOn:
    id: patient-profile-record-0-card
- scrollUntilVisible:
    element:
      id: read-only-preview-export-button
    direction: DOWN
    timeout: 20000
- tapOn:
    id: read-only-preview-export-button
- scrollUntilVisible:
    element:
      id: export-share-export-pdf-button
    direction: DOWN
    timeout: 20000
- tapOn:
    id: export-share-export-pdf-button
- assertVisible: Saved
- tapOn:
    text: OK
- runFlow:
    when:
      visible:
        id: export-share-back-button
    commands:
      - tapOn:
          id: export-share-back-button
- runFlow:
    when:
      visible:
        id: export-share-full-note-mode-chip
    commands:
      - back
- assertVisible:
    id: read-only-preview-back-button
- tapOn:
    id: read-only-preview-back-button
- scrollUntilVisible:
    element:
      id: patient-profile-timeline-0-card
    direction: DOWN
    timeout: 20000
- tapOn:
    id: patient-profile-timeline-0-card
- scrollUntilVisible:
    element:
      id: prior-session-copy-forward-button
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: prior-session-copy-forward-button
- tapOn:
    id: prior-session-carry-forward-chip
- tapOn:
    id: prior-session-copy-forward-button
- scrollUntilVisible:
    element:
      id: note-save-draft-button
    direction: DOWN
    timeout: 20000
- assertVisible:
    id: note-save-draft-button
- tapOn:
    id: note-view-history-button
- assertVisible: Note History
- back
- assertVisible:
    id: dashboard-search-input
